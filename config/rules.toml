# Sentinel-RS Risk Engine Rules & Weights (/etc/sentinel/rules.toml)

[thresholds]
low_max = 39      # 0..39: Разрешить и записать в аудит-лог
grey_max = 74     # 40..74: Интерактивный запрос пользователю (Freeze & Inspect)
high_min = 75     # 75..100: Мгновенная блокировка (-EPERM) и SIGSTOP

[rules.fileless_memfd]
id = "FILELESS_MEMFD"
weight = 50
description = "Исполнение кода напрямую из оперативной памяти (memfd_create)"

[rules.secret_non_owner]
id = "SECRET_NON_OWNER"
weight = 40
description = "Чтение защищённого секрета процессом, не являющимся владельцем по App Scope"

[rules.untrusted_binary_origin]
id = "UNTRUSTED_BINARY_ORIGIN"
weight = 25
description = "Исполняемый файл или скрипт запущен из /tmp, /dev/shm, ~/Downloads или не принадлежит dpkg"

[rules.suspicious_interpreter]
id = "SUSPICIOUS_INTERPRETER"
weight = 20
description = "Интерпретатор запущен с inline-кодом (-c, -e), eval, base64 или получен через pipe"

[rules.fast_exfil_burst]
id = "FAST_EXFIL_BURST"
weight = 15
description = "Попытка сетевого подключения в течение <= 5 секунд после чтения секрета"

[rules.raw_ip_connect]
id = "RAW_IP_CONNECT"
weight = 10
description = "Подключение напрямую по IP-адресу без зафиксированного DNS-запроса"

[rules.trusted_package_context]
id = "TRUSTED_PACKAGE_CONTEXT"
weight = -35
description = "Бинарник верифицирован в пакетах системы (dpkg) и запущен в штатном контексте"
