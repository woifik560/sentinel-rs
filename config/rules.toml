# Sentinel-RS Risk Engine Rules & Weights (/etc/sentinel/rules.toml)

[thresholds]
low_max = 39      # 0..39: Разрешить и записать в аудит-лог
grey_max = 74     # 40..74: Интерактивный запрос пользователю (Freeze & Inspect via NFQUEUE)
high_min = 75     # 75..100: Мгновенная блокировка (NF_DROP / -EPERM) и опциональный SIGSTOP/SIGKILL

[rules.fileless_memfd]
id = "FILELESS_MEMFD"
weight = 50
description = "Исполнение кода напрямую из оперативной памяти (memfd_create / anonymous memory)"

[rules.fileless_anon_exec]
id = "FILELESS_ANON_EXEC"
weight = 35
description = "Исполнение исполняемой памяти через mmap PROT_EXEC на анонимную память, удалённый (deleted) файл или tmpfs без имени"

[rules.secret_non_owner]
id = "SECRET_NON_OWNER"
weight = 40
description = "Чтение защищённого секрета или наследование taint через pipe/файл процессом вне App Scope"

[rules.untrusted_binary_origin]
id = "UNTRUSTED_BINARY_ORIGIN"
weight = 25
description = "Исполняемый файл или скрипт запущен из /tmp, /dev/shm, ~/Downloads или не верифицирован в dpkg"

[rules.suspicious_script_execution]
id = "SUSPICIOUS_SCRIPT_EXECUTION"
weight = 25
description = "Выполнение скрипта из анонимного источника, пайпа stdin или с подозрительными флагами запуска (-c, -e, eval)"

[rules.suspicious_interpreter]
id = "SUSPICIOUS_INTERPRETER"
weight = 20
description = "Интерпретатор запущен с inline-кодом (-c, -e), eval, base64 или получен через pipe"

[rules.first_seen_destination]
id = "FIRST_SEEN_DESTINATION"
weight = 15
description = "Первое подключение процесса к внешнему публичному IP-адресу (вне RFC1918 и loopback)"

[rules.fast_exfil_burst]
id = "FAST_EXFIL_BURST"
weight = 15
description = "Попытка сетевого подключения в течение <= 5 секунд после чтения секрета"

[rules.raw_ip_connect]
id = "RAW_IP_CONNECT"
weight = 10
description = "Подключение напрямую по IP-адресу без зафиксированного DNS-запроса"

[rules.tofu_tampered_binary]
id = "TOFU_TAMPERED_BINARY"
weight = 40
description = "Криптографическое несоответствие SHA-256 бинарника в базе TOFU (бинарник был подменён или модифицирован после первого запуска)"

[rules.ipc_taint_launder]
id = "IPC_TAINT_LAUNDER"
weight = 30
description = "Попытка отмывания taint через передачу в AF_UNIX сокет или перехват памяти ptrace"

[rules.trusted_package_context]
id = "TRUSTED_PACKAGE_CONTEXT"
weight = -35
description = "Бинарник верифицирован в пакетах системы (dpkg) и запущен в штатном контексте (не действует при наличии Taint!)"
